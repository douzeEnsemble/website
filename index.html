<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>douzeEnsemble</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    h1 { margin: 0; font-size: 10vw; font-family: sans-serif; user-select: none; cursor: default; }
    body.awesome h1 { color: #fff; -webkit-text-stroke: 0.04em #000; paint-order: stroke fill; }
  </style>
</head>
<body>
  <h1>douzeEnsemble</h1>
  <script>
    const body = document.body;
    const title = document.querySelector('h1');

    // Couleurs aléatoires à chaque chargement : fond et texte de teintes opposées, contraste garanti.
    const hue = Math.floor(Math.random() * 360);
    const darkBg = Math.random() < 0.5;
    body.style.background = `hsl(${hue} 70% ${darkBg ? 18 : 88}%)`;
    title.style.color = `hsl(${(hue + 180) % 360} 80% ${darkBg ? 75 : 30}%)`;

    // Konami code : couleurs du set LEGO « Everyone is awesome ».
    const awesome = ['#b57edc', '#e40303', '#ff8c00', '#ffed00', '#008026', '#004dff',
      '#750787', '#000000', '#613915', '#5bcefa', '#f5a9b8', '#ffffff'];
    const konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
      'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let step = 0;
    document.addEventListener('keydown', (e) => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      step = key === konami[step] ? step + 1 : (key === konami[0] ? 1 : 0);
      if (step === konami.length) {
        step = 0;
        const w = 100 / awesome.length;
        body.style.background = `linear-gradient(90deg, ${awesome
          .map((c, i) => `${c} ${i * w}% ${(i + 1) * w}%`).join(', ')})`;
        title.style.color = '';
        body.classList.add('awesome');
      }
    });

    // Double-clic : le nom rebondit dans la page pendant 2,5 s puis revient au centre.
    let bouncing = false;
    title.addEventListener('dblclick', () => {
      if (bouncing) return;
      bouncing = true;
      const start = title.getBoundingClientRect();
      let x = start.left, y = start.top;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.max(innerWidth, innerHeight) * (0.9 + Math.random() * 0.6);
      let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
      const t0 = performance.now();
      let last = t0;
      Object.assign(title.style, { position: 'fixed', left: '0', top: '0', transform: `translate(${x}px, ${y}px)` });

      function frame(now) {
        const dt = (now - last) / 1000;
        last = now;
        const maxX = innerWidth - start.width, maxY = innerHeight - start.height;
        x += vx * dt; y += vy * dt;
        if (x < 0) { x = 0; vx = Math.abs(vx); }
        if (x > maxX) { x = Math.max(0, maxX); vx = -Math.abs(vx); }
        if (y < 0) { y = 0; vy = Math.abs(vy); }
        if (y > maxY) { y = Math.max(0, maxY); vy = -Math.abs(vy); }
        title.style.transform = `translate(${x}px, ${y}px)`;
        if (now - t0 < 2500) {
          requestAnimationFrame(frame);
        } else {
          title.style.transition = 'transform 0.5s ease-out';
          title.style.transform = `translate(${(innerWidth - start.width) / 2}px, ${(innerHeight - start.height) / 2}px)`;
          setTimeout(() => {
            Object.assign(title.style, { position: '', left: '', top: '', transform: '', transition: '' });
            bouncing = false;
          }, 500);
        }
      }
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
